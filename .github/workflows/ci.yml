"""
Pipeline de integración continua.

Este workflow valida que la aplicación pueda instalar sus dependencias
y que sus principales módulos puedan ser importados correctamente.

El pipeline se ejecuta automáticamente en cada push y pull request
sobre la rama main.
"""

name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  validate:
    name: Validate application

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate application imports
        env:
          DATABASE_URL: sqlite:///ci.db
        run: |
          python -c "from app import create_app; create_app(); print('Application OK')"

      - name: Validate GraphQL schema
        env:
          DATABASE_URL: sqlite:///ci.db
        run: |
          python -c "from services.products.graphql.schema import schema; print(schema.graphql_schema)"

      - name: Validate Swagger configuration
        env:
          DATABASE_URL: sqlite:///ci.db
        run: |
          python -c "from app import create_app; app=create_app(); print('Swagger configuration OK')"